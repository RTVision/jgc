<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Organization - Gitea</title>
  <link rel="stylesheet" th:href="@{/assets/css/gitea-style.css}">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div class="main-container">
  <div class="page-content compact">
    <div class="logo-container">
      <img src="https://raw.githubusercontent.com/detain/svg-logos/b02ee1ac30c7ff4757278337c95588b01ed0954b/svg/g/gitea.svg" alt="Gitea Logo" class="logo">
    </div>

    <h2 class="ui header center aligned" th:text="${organizationName != null ? 'Select Repositories' : 'Select Organization'}">Select Organization</h2>
    <p class="center aligned description" th:text="${organizationName != null ? 'Choose the repositories to connect from ' + organizationName : 'Choose an organization to continue'}">Choose an organization to continue</p>

    <div class="search-container">
      <div class="ui input fluid">
        <input type="text" id="orgSearch" placeholder="Search organizations...">
      </div>
    </div>

    <div class="repo-scope-container" id="repoScopeContainer" th:if="${organizationName != null}">
      <div class="organization-item scope-option" id="scopeAllOption" data-scope="all">
        <div class="org-content">
          <div class="org-name">All repositories</div>
          <div class="org-subtext">Give access to all current and future repositories.</div>
        </div>
        <div class="org-selector">
          <div class="selection-indicator"></div>
        </div>
      </div>
      <div class="organization-item scope-option" id="scopeSelectedOption" data-scope="selected">
        <div class="org-content">
          <div class="org-name">Only select repositories</div>
        </div>
        <div class="org-selector">
          <div class="selection-indicator"></div>
        </div>
      </div>
    </div>

    <div class="organizations-scroll-container" id="organizationsScrollContainer">
      <div class="organizations-list" id="organizationsList">
        <div th:if="${(organizations == null or #lists.isEmpty(organizations)) and (repositories == null or #lists.isEmpty(repositories))}" class="no-organizations">
          No options available
        </div>
        <div th:each="org : ${organizations}" class="organization-item" th:if="${organizations != null}" th:attr="data-id=${org.id}" th:data-name="${org.name}">
          <div class="org-avatar">
            <img th:src="${org.avatarUrl}" th:alt="${org.name}" class="avatar-image">
          </div>
          <div class="org-content">
            <div class="org-name" th:text="${org.name}">Organization Name</div>
          </div>
          <div class="org-selector">
            <div class="selection-indicator"></div>
          </div>
        </div>
        <label th:each="repository : ${repositories}" th:if="${repositories != null}" class="organization-item" th:attr="data-repository=${repository.fullName}">
          <div class="org-avatar">
            <img th:src="${repository.owner.avatarUrl}" th:alt="${repository.fullName}" class="avatar-image">
          </div>
          <div class="org-content">
            <div class="org-name" th:text="${repository.fullName}">owner/repo</div>
          </div>
          <div class="org-selector">
            <input type="checkbox" class="repo-checkbox" th:value="${repository.fullName}" th:checked="${selectedRepositories != null and #sets.contains(selectedRepositories, repository.fullName)}">
          </div>
        </label>
      </div>
    </div>

    <div class="ui divider compact"></div>

    <div class="button-container compact">
      <button type="button" class="ui primary button" id="selectBtn" th:text="${organizationName != null ? 'Save Selection' : 'Select Organization'}" disabled>Select Organization</button>
    </div>
  </div>
</div>

<script th:inline="javascript">
  /*<![CDATA[*/
  let selectedOrgId = null;
  let selectedOrgName = null;
  const isRepositorySelection = [[${organizationName != null}]];
  const hasSelectedRepositories = [[${selectedRepositories != null and !#sets.isEmpty(selectedRepositories)}]];
  let repositoryScope = hasSelectedRepositories ? 'selected' : 'all';

  function selectOrganization(orgId, orgName) {
    selectedOrgId = orgId;
    selectedOrgName = orgName;

    // Update UI for all organization items
    document.querySelectorAll('.organization-item').forEach(item => {
      if (item.getAttribute('data-id') == orgId) {
        item.classList.add('selected');
      } else {
        item.classList.remove('selected');
      }
    });

    document.getElementById('selectBtn').disabled = false;
  }

  function selectRepositoryScope(scope) {
    repositoryScope = scope;

    document.querySelectorAll('.scope-option').forEach(option => {
      option.classList.toggle('selected', option.getAttribute('data-scope') === scope);
    });

    const repositoryList = document.getElementById('organizationsScrollContainer');
    repositoryList.classList.toggle('repo-list-disabled', scope === 'all');
    document.querySelectorAll('.repo-checkbox').forEach(checkbox => {
      checkbox.disabled = scope === 'all';
    });

    updateRepositorySelection();
  }

  function filterOrganizations() {
    const searchTerm = document.getElementById('orgSearch').value.toLowerCase();
    const orgItems = document.querySelectorAll('.organization-item:not(.scope-option)');

    orgItems.forEach(item => {
      const sourceName = item.getAttribute('data-name') || item.getAttribute('data-repository') || '';
      const orgName = sourceName.toLowerCase();
      if (orgName.includes(searchTerm)) {
        item.style.display = 'flex';
      } else {
        item.style.display = 'none';
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.organization-item:not(.scope-option)').forEach(item => {
      if (!isRepositorySelection) {
        item.addEventListener('click', function () {
          const orgId = this.getAttribute('data-id');
          const orgName = this.getAttribute('data-name');
          selectOrganization(orgId, orgName);
        });
      } else {
        item.addEventListener('click', function (event) {
          if (event.target.classList.contains('repo-checkbox') || repositoryScope === 'all') {
            return;
          }
          const checkbox = this.querySelector('.repo-checkbox');
          checkbox.checked = !checkbox.checked;
          updateRepositorySelection();
        });
      }
    });

    document.getElementById('orgSearch').addEventListener('input', filterOrganizations);

    if (isRepositorySelection) {
      document.querySelectorAll('.scope-option').forEach(option => {
        option.addEventListener('click', function () {
          selectRepositoryScope(this.getAttribute('data-scope'));
        });
      });
      selectRepositoryScope(repositoryScope);
    }

    document.querySelectorAll('.repo-checkbox').forEach(checkbox => {
      checkbox.addEventListener('change', updateRepositorySelection);
    });

    document.getElementById('selectBtn').addEventListener('click', function () {
      if (!isRepositorySelection && selectedOrgId) {
        const installationId = [[${installationId}]];
        this.innerHTML = '<div class="ui active mini inline loader"></div> Connecting...';
        this.disabled = true;
        axios.post('/installations/' + installationId + '/organizations/select', {
          organizationId: selectedOrgId
        })
        .then(response => {
          if (response.status === 200 && response.data && response.data.redirectUrl) {
            window.location.href = response.data.redirectUrl;
          } else {
            window.location.href = /*[[@{/application-error}]]*/ "/application-error";
          }
        })
        .catch(error => {
          window.location.href = /*[[@{/application-error}]]*/ "/application-error";
        });
      } else if (isRepositorySelection) {
        const installationId = [[${installationId}]];
        const repositories = repositoryScope === 'all'
            ? []
            : Array.from(document.querySelectorAll('.repo-checkbox:checked')).map(checkbox => checkbox.value);
        this.innerHTML = '<div class="ui active mini inline loader"></div> Saving...';
        this.disabled = true;
        axios.post('/installations/' + installationId + '/repositories/select', {
          repositories: repositories
        })
        .then(response => {
          if (response.status === 200 && response.data && response.data.redirectUrl) {
            window.location.href = response.data.redirectUrl;
          } else {
            window.location.href = /*[[@{/application-error}]]*/ "/application-error";
          }
        })
        .catch(error => {
          window.location.href = /*[[@{/application-error}]]*/ "/application-error";
        });
      }
    });
  });

  function updateRepositorySelection() {
    if (repositoryScope === 'all') {
      document.getElementById('selectBtn').disabled = false;
      return;
    }
    const checked = document.querySelectorAll('.repo-checkbox:checked').length;
    document.getElementById('selectBtn').disabled = checked === 0;
  }
  /*]]>*/
</script>
</body>
</html>
